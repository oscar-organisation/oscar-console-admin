# Les fiches du dépôt oscar-console-admin, lues par le portail technique.
#
# Le portail cherche un fichier catalog-info.yaml à la racine de chaque dépôt
# de l'organisation, sur main. Celui-ci ne décrit rien lui-même: c'est une
# Location, qui nomme la fiche de chaque application, dans son propre dossier
# (décision 62), comme le dépôt oscar-infrastructure.
#
# Il remplace la fiche d'avant, qui décrivait le dépôt entier comme un seul
# composant (oscar-console-admin), avec une documentation (dir:.) qui
# n'existait pas à la racine. Les deux applications, l'interface et l'API, se
# mettent en ligne chacune de son côté: chacune a sa fiche et sa documentation.

apiVersion: backstage.io/v1alpha1
kind: Location
metadata:
  name: oscar-console-admin
  description: Les deux applications de la console d'administration, chacune dans son dossier.
spec:
  targets:
    - ./oscar_console_admin_frontend/catalog-info.yaml
    - ./oscar_console_admin_api_backend/catalog-info.yaml
