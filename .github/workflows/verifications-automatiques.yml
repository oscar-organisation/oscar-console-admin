# Les vérifications automatiques du dépôt oscar-console-admin: ce que GitHub
# lance seul à chaque PR et à chaque envoi sur test ou main, au patron commun des
# dépôts (outil DNS, laboratoire, portail).
#
#   verifications_rapides   lignes d'attribution, secrets, fichiers
#                           d'environnement, typographie, fichiers des
#                           workflows, compositions lues comme Coolify, cockpit
#                           XR, documentation des deux applications
#   tests                   les tests de l'API (pytest) et de l'interface
#                           (relecture, types, tests unitaires, construction),
#                           chacun dans un conteneur, par le tester.sh de son
#                           dossier: la même commande que sur le poste
#   deploiement_api         le déploiement automatique commun par image de
#   deploiement_interface   Harbor (deploiement-par-image-harbor.yml), une fois
#                           par application: à l'envoi sur test, l'image de
#                           chaque application dont le dossier a changé est
#                           construite une seule fois, rangée dans Harbor, mise
#                           en ligne en test; à l'envoi sur main, LA MÊME en
#                           production; pour une PR de test vers main, la
#                           vérification que l'image testée existe
#   resume                  un résumé de l'exécution, et un seul commentaire
#                           dans la PR
#
# Chaque tâche attend la précédente: une tâche en échec arrête tout, et rien
# n'est mis en ligne. Une PR ne met jamais rien en ligne. Les tests d'écran
# (Playwright) ne font pas partie du parcours automatique: ils se lancent à la
# main, avec oscar_console_admin_frontend/tester-les-ecrans.sh (décision 91).
#
# Le guide commun du cycle, dans le dépôt oscar-general-gouvernance-project,
# explique le trajet travail/<sujet> vers test vers main. Ce fichier ne le
# recopie pas.
name: Vérifications automatiques

on:
  push:
    branches: [test, main]
  pull_request:
    branches: [test, main]

# Par défaut, une exécution ne fait que lire. Les tâches de déploiement demandent
# en plus le droit de déclarer leurs déploiements; celle du résumé, d'écrire son
# commentaire dans la PR; rien d'autre.
permissions:
  contents: read

env:
  # Les dossiers des deux applications. Chacune y vit tout entière: code, tests,
  # composition, réglages, documentation (décision 62). Leurs noms ne sont
  # écrits qu'ici pour les étapes de ce fichier; les appels au déploiement
  # commun les répètent, parce qu'un workflow appelé ne lit pas ces variables.
  INTERFACE: oscar_console_admin_frontend
  API: oscar_console_admin_api_backend

jobs:

  verifications_rapides:
    name: Vérifications rapides
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # L'historique complet: le contrôle des messages de commit doit
          # pouvoir dire quels commits l'exécution apporte.
          fetch-depth: 0

      - name: Aucune ligne d'attribution dans les commits
        # La règle A18, écrite une fois, avec ses tests, dans une action du
        # dépôt oscar-infrastructure.
        uses: oscar-organisation/oscar-infrastructure/.github/actions/controler-les-commits@main

      - name: Chercher des motifs de secrets
        run: |
          set -u
          # Les jetons de GitHub, les clés privées, les jetons de Coolify, et
          # les jetons signés (JWT: trois morceaux en base 64 séparés par des
          # points, les deux premiers commençant par eyJ), comme celui qu'une
          # ancienne construction du cockpit XR avait embarqué. Seuls le
          # fichier et la ligne s'affichent, jamais la valeur.
          motifs='github_pat_[A-Za-z0-9_]{20,}|ghp_[A-Za-z0-9]{30,}|gho_[A-Za-z0-9]{30,}|-----BEGIN [A-Z ]*PRIVATE KEY-----|[0-9]+\|[A-Za-z0-9]{40,}|eyJ[A-Za-z0-9_-]{8,}\.eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}'
          trouves=$(grep -rlE "$motifs" . --exclude-dir=.git --exclude-dir=node_modules --exclude=package-lock.json || true)
          if [ -n "$trouves" ] ; then
            printf '%s\n' "$trouves" | while read -r f ; do
              echo "::error file=$f::Un secret semble présent dans ce fichier."
            done
            exit 1
          fi
          echo "Aucun motif de secret trouvé."

      - name: Chaque fichier d'environnement a son modèle
        # Un fichier .env versionné doit avoir son modèle .env.exemple à côté,
        # qui dit à quoi sert chaque réglage. Aucun .env n'est versionné
        # aujourd'hui: seuls les modèles le sont.
        run: |
          set -u
          manque=0
          for f in $(git ls-files | grep -E '(^|/)\.env$') ; do
            d=$(dirname "$f")
            if [ ! -f "$d/.env.exemple" ] ; then
              echo "::error::$f n'a pas de modèle à côté ($d/.env.exemple)."
              manque=1
            fi
          done
          [ "$manque" = "0" ] || exit 1
          echo "Chaque fichier d'environnement a son modèle."

      - name: Chaque variable des compositions est expliquée dans .env.exemple
        # Dans les deux sens: une variable lue par compose.yaml ou
        # compose.override.yaml sans explication, ou une explication d'une
        # variable que plus rien ne lit, arrêtent les vérifications.
        run: |
          set -u
          ecart=0
          for d in "$INTERFACE" "$API" ; do
            lues=$(grep -ohE '\$\{[A-Z_]+' "$d/compose.yaml" "$d/compose.override.yaml" | sed 's/^\${//' | sort -u)
            expliquees=$(sed -nE 's/^([A-Z_]+)=.*/\1/p' "$d/.env.exemple" | sort -u)
            sans_explication=$(comm -23 <(printf '%s\n' "$lues") <(printf '%s\n' "$expliquees"))
            jamais_lues=$(comm -13 <(printf '%s\n' "$lues") <(printf '%s\n' "$expliquees"))
            for v in $sans_explication ; do
              echo "::error file=$d/.env.exemple::$v est lue par la composition de $d, mais n'est pas expliquée dans .env.exemple."
              ecart=1
            done
            for v in $jamais_lues ; do
              echo "::error file=$d/.env.exemple::$v est expliquée dans .env.exemple, mais aucune composition de $d ne la lit."
              ecart=1
            done
          done
          [ "$ecart" = "0" ] || exit 1
          echo "Les variables des compositions et des modèles correspondent."

      - name: Typographie, pas de caractère interdit
        # Les motifs sont écrits en hexadécimal pour que ce fichier ne contienne
        # pas lui-même les caractères qu'il interdit: le tiret long et les
        # points de suspension en un seul caractère.
        #
        # Le contrôle couvre ce que l'équipe OSCAR écrit dans ce dépôt:
        # documentation, compositions, workflows, scripts, réglages. Le code des
        # deux applications, repris tel quel du dépôt des développeurs de la
        # console, en porte encore (dans des commentaires et des textes
        # affichés): il n'est pas contrôlé ici tant que sa mise en conformité
        # n'est pas décidée (compte rendu de la reprise, plan 20). Le cockpit XR
        # est une construction générée, qui se corrige dans son propre dépôt.
        run: |
          set -u
          if git ls-files -z -- '*.md' '*.py' '*.ts' '*.tsx' '*.js' '*.jsx' '*.css' '*.sh' \
               '*.conf' '*.yml' '*.yaml' '*.json' '*.exemple' '*Dockerfile' \
               ':!:*package-lock.json' \
               ":!:$INTERFACE/src" ":!:$INTERFACE/public/xr" \
               ":!:$API/app" ":!:$API/alembic" ":!:$API/tests" \
               | xargs -0 -r grep -nP '\x{2014}|\x{2026}' ; then
            echo "::error::Caractère interdit trouvé. Utiliser le tiret simple et trois points."
            exit 1
          fi
          echo "Typographie conforme."

      - name: Les fichiers des vérifications automatiques sont valides
        # actionlint relit chaque workflow: syntaxe, expressions, entrées des
        # workflows appelés. Un workflow cassé ne se voit sinon qu'à l'exécution
        # suivante, qui ne démarre pas.
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color

      - name: Les ordinateurs de GitHub qui font les vérifications sont fixés sur une version
        # Décision A38: les vérifications automatiques donnent le même résultat
        # d'une semaine à l'autre. Un nom qui bouge, comme ubuntu-latest (Ubuntu 26
        # à partir du 19/10/2026), changerait le système sans que rien ne change
        # chez nous. Toutes les tâches tournent donc sur une version nommée, la
        # même partout: on en change dans une PR à part, pour toutes les tâches à
        # la fois, une fois les vérifications automatiques réussies.
        # La version n'est écrite qu'aux lignes runs-on, pas ici. Le script est le
        # même, mot pour mot, que dans oscar-infrastructure, oscar-test et le portail.
        run: |
          set -u
          # Les machines nommées aux lignes runs-on, une par ligne, puis sur une seule ligne.
          machines=$(sed -nE 's/^[[:space:]]+runs-on:[[:space:]]*//p' .github/workflows/*.yml | sort -u)
          liste=$(printf '%s\n' "$machines" | paste -sd ' ' -)
          if [ -z "$machines" ] ; then
            echo "::error::Aucune ligne runs-on lue dans .github/workflows: le contrôle ne voit rien."
            exit 1
          fi
          if printf '%s\n' "$machines" | grep -q -- '-latest' ; then
            echo "::error::Une tâche tourne sur une machine qui change seule ($liste). La nommer, par exemple ubuntu-24.04 (décision A38)."
            exit 1
          fi
          if [ "$(printf '%s\n' "$machines" | wc -l)" -ne 1 ] ; then
            echo "::error::Les tâches ne tournent pas toutes sur la même machine ($liste). En changer pour toutes à la fois (décision A38)."
            exit 1
          fi
          echo "Toutes les tâches tournent sur $liste."

      - name: Les compositions sont valides, dans leurs trois lectures
        run: |
          set -eu
          for d in "$INTERFACE" "$API" ; do
            # Telle que Coolify la lit (-f, sans le complément local ni fichier
            # d'environnement, leçon 6.7), telle qu'on la lance en local (avec le
            # complément), et avec les réglages du poste (.env.exemple).
            ( cd "$d" && docker compose --env-file /dev/null -f compose.yaml config --quiet )
            ( cd "$d" && docker compose config --quiet )
            ( cd "$d" && docker compose --env-file .env.exemple config --quiet )
            # Coolify ne doit voir aucun port publié (leçon 5.4).
            if ( cd "$d" && docker compose --env-file /dev/null -f compose.yaml config ) | grep -q 'published:' ; then
              echo "::error file=$d/compose.yaml::$d/compose.yaml publie un port: il va dans compose.override.yaml."
              exit 1
            fi
            echo "$d: composition valide."
          done

      - name: Le cockpit XR est complet et dit d'où il vient
        # Le cockpit embarqué doit être servi sous /xr/ et nommer la révision du
        # dépôt oscar_front_casque_vr_ar qui l'a produit. L'image refuse aussi de
        # se construire sans lui; ce contrôle le dit dès la PR.
        working-directory: ${{ env.INTERFACE }}/public/xr
        run: |
          set -u
          test -f index.html || { echo "::error::public/xr/index.html manque: reconstruire le cockpit (scripts/update-xr-bundle.sh)."; exit 1; }
          grep -q '/xr/assets/' index.html || { echo "::error::public/xr/index.html n'est pas construit pour la base /xr/."; exit 1; }
          grep -qE '^revision=[0-9a-f]{40}$' .source-revision || { echo "::error::public/xr/.source-revision ne nomme pas une révision complète."; exit 1; }
          echo "Cockpit XR complet, $(grep '^revision=' .source-revision)."

      - name: La documentation des deux applications se construit, sans aucun avertissement
        # Comme TechDocs la construit pour le portail, en mode strict: un lien
        # cassé, une ancre absente, une page oubliée dans le menu arrêtent les
        # vérifications. Même image figée que le guide commun et Harbor.
        run: |
          set -eu
          for d in "$INTERFACE" "$API" ; do
            ( cd "$d" && docker compose -f docs/outils/compose.yaml run --rm construire )
          done

  tests:
    name: Tests du code
    needs: verifications_rapides
    # La PR de test vers main et l'envoi sur main ne refont rien (plan 17, décision 90):
    # le contenu de main est celui que test a vérifié, et le déploiement commun retrouve
    # l'image testée, avec un refus net si elle manque. Les tests tournent pour toute
    # autre PR et à l'envoi sur test.
    if: >-
      !(github.event_name == 'push' && github.ref_name == 'main')
      && !(github.event_name == 'pull_request' && github.base_ref == 'main' && github.head_ref == 'test')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Les tests de l'API, en conteneur
        # Toute la suite pytest, sur une base SQLite: ni PostgreSQL ni service
        # extérieur. La même commande que sur le poste.
        run: ./${{ env.API }}/tester.sh

      - name: Les vérifications de l'interface, en conteneur
        # npm run quality: relecture du code, types, tests unitaires,
        # construction, sous la même version de Node que l'image.
        run: ./${{ env.INTERFACE }}/tester.sh

  deploiement_api:
    name: "API: construire, ranger et mettre en ligne"
    # Après tout le reste (leçon 5.1): une vérification en échec ne met rien en ligne.
    # Des tests sautés (pour main, voir la tâche « tests ») ne retiennent pas le
    # déploiement; des tests en échec, si.
    needs: [verifications_rapides, tests]
    if: >-
      !cancelled() && needs.verifications_rapides.result == 'success'
      && (needs.tests.result == 'success' || needs.tests.result == 'skipped')
    permissions:
      contents: read
      deployments: write
    uses: oscar-organisation/oscar-infrastructure/.github/workflows/deploiement-par-image-harbor.yml@main
    with:
      # Les applications Coolify console-admin-api-test et console-admin-api-production,
      # et les environnements GitHub du même nom, où vit COOLIFY_APPLICATION (A2).
      application: console-admin-api
      # Le dépôt d'images oscar/console-admin-api: le début commun aux deux
      # applications de la console, puis le service de la composition.
      nom_des_images: console-admin
      dossier: oscar_console_admin_api_backend
      # Le seul service construit; la base est l'image publique postgres.
      services: api
      # Ce qui n'entre pas dans l'empreinte du contenu: la documentation et les
      # fiches du portail. Les modifier ne reconstruit ni ne remet en ligne l'API.
      ignorer: |
        *.md
        catalog-info.yaml
        mkdocs.yml
        docs/
      site_test: https://test-api-console.oscar-bot.com
      site_production: https://api-console.oscar-bot.com
      # 200 seulement si l'API répond et que sa base répond, 503 sinon (leçon 3.7).
      sante_test: https://test-api-console.oscar-bot.com/health
      sante_production: https://api-console.oscar-bot.com/health
    secrets:
      coolify_jeton: ${{ secrets.COOLIFY_JETON }}
      harbor_compte_envoi_nom: ${{ secrets.HARBOR_COMPTE_ENVOI_NOM }}
      harbor_compte_envoi_secret: ${{ secrets.HARBOR_COMPTE_ENVOI_SECRET }}

  deploiement_interface:
    name: "Interface: construire, ranger et mettre en ligne"
    # Après l'API: l'interface l'appelle, et un seul déploiement à la fois tourne
    # sur la machine (R-35). Si seule l'interface a changé, la tâche de l'API ne
    # construit rien et constate que son image est déjà en ligne.
    needs: [verifications_rapides, tests, deploiement_api]
    if: >-
      !cancelled() && needs.verifications_rapides.result == 'success'
      && (needs.tests.result == 'success' || needs.tests.result == 'skipped')
      && needs.deploiement_api.result == 'success'
    permissions:
      contents: read
      deployments: write
    uses: oscar-organisation/oscar-infrastructure/.github/workflows/deploiement-par-image-harbor.yml@main
    with:
      # Les applications Coolify console-admin-interface-test et
      # console-admin-interface-production, et les environnements GitHub du même nom.
      application: console-admin-interface
      # Le dépôt d'images oscar/console-admin-interface.
      nom_des_images: console-admin
      dossier: oscar_console_admin_frontend
      services: interface
      ignorer: |
        *.md
        catalog-info.yaml
        mkdocs.yml
        docs/
      site_test: https://test-console.oscar-bot.com
      site_production: https://console.oscar-bot.com
      # index.html est servi tel quel, sans repli: 404 si l'application manque.
      sante_test: https://test-console.oscar-bot.com/index.html
      sante_production: https://console.oscar-bot.com/index.html
    secrets:
      coolify_jeton: ${{ secrets.COOLIFY_JETON }}
      harbor_compte_envoi_nom: ${{ secrets.HARBOR_COMPTE_ENVOI_NOM }}
      harbor_compte_envoi_secret: ${{ secrets.HARBOR_COMPTE_ENVOI_SECRET }}

  resume:
    name: Résumé
    # Toujours, même quand une tâche échoue: le résumé dit alors ce qui a échoué et que
    # rien n'a été mis en ligne.
    if: always()
    needs: [verifications_rapides, tests, deploiement_api, deploiement_interface]
    runs-on: ubuntu-24.04
    # Lire le début de l'exécution (sa durée), écrire le commentaire de la PR.
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - name: Écrire le résumé, et le commentaire de la PR
        uses: oscar-organisation/oscar-infrastructure/.github/actions/deploiement-par-image-harbor@main
        with:
          etape: resumer
          taches: ${{ toJSON(needs) }}
          numero_de_la_pr: ${{ github.event.pull_request.number }}
          jeton_github: ${{ github.token }}
