# Ce qui s'ajoute quand on travaille en local, et seulement en local.
#
# POURQUOI CE FICHIER EXISTE
#
# En local, on ouvre la console dans un navigateur sans nom de domaine: il faut
# donc publier un port sur le poste. En déploiement, on n'en veut surtout pas:
# le proxy joint l'interface par le réseau de Docker, et un port publié est
# unique sur une machine, ce qui empêcherait le test et la production de
# tourner côte à côte (leçon 5.4).
#
# COMMENT IL EST PRIS EN COMPTE, ET COMMENT IL NE L'EST PAS
#
# En local, « docker compose up » lit compose.yaml PUIS ce fichier, et les
# fusionne, sans rien demander. Coolify, lui, désigne un fichier précis
# (-f compose.yaml): ce fichier-ci lui est invisible.
#
# LA CONSTRUCTION DE L'IMAGE
#
# compose.yaml ne fait que nommer l'image de l'entrepôt; elle se construit ici,
# sur le poste. GitHub construit aussi par ce fichier, avant de ranger l'image
# dans l'entrepôt: une seule façon de construire. pull_policy: never: le poste
# ne demande jamais cette image à l'entrepôt, qui est privé.
#
# LA RÈGLE DE SÉCURITÉ DU POSTE
#
# Sur le poste, l'API répond en http (127.0.0.1:18202), et la règle de
# sécurité de l'image n'autorise que https: le fichier
# nginx-security-headers.poste.conf la remplace, monté ci-dessous. Il ne
# diffère de nginx-security-headers.conf que par l'API du poste; les
# vérifications automatiques de GitHub le contrôlent.
#
# LE NUMÉRO
#
# 18200, le premier du bloc 182xx de la console, sur la boucle locale
# 127.0.0.1. L'API locale répond sur 18202 (son propre dossier).
# Voir _pilotage/work-report/3-connaissance-du-projet/09-CONVENTION-des-ports.md.

services:

  interface:
    build:
      # Le dossier de l'interface lui-même (décision 62). L'étape « production »
      # du Dockerfile: le serveur web, avec l'application et le cockpit XR.
      context: .
      target: production
    pull_policy: never
    ports:
      - "127.0.0.1:${OSCAR_PORT_PUBLIE_INTERFACE:-18200}:3000"
    volumes:
      # La règle de sécurité du poste à la place de celle de l'image: elle
      # autorise en plus l'API du poste, servie en http sur la boucle locale
      # (décision 120). Sans elle, le navigateur refuse d'appeler l'API du
      # poste. L'image, donc le test et la production, garde la règle d'origine.
      - ./nginx-security-headers.poste.conf:/etc/nginx/snippets/security-headers.conf:ro
