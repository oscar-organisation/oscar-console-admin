# La règle de sécurité de l'interface SUR LE POSTE DU DÉVELOPPEUR seulement
# (décision 120). compose.override.yaml la monte à la place de
# nginx-security-headers.conf; l'image, donc le test et la production, garde
# la règle d'origine.
#
# Une seule différence: connect-src autorise aussi l'API du poste, servie en
# http sur la boucle locale (127.0.0.1 ou localhost), quel que soit son port.
# La règle d'origine n'autorise que https: le navigateur refusait l'appel à
# l'API du poste, et la connexion échouait (mesuré le 04/10/2026).
#
# Les vérifications automatiques de GitHub refusent toute autre différence
# entre les deux fichiers: une règle changée dans l'un doit l'être dans l'autre.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https: wss: http://127.0.0.1:* http://localhost:*; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
