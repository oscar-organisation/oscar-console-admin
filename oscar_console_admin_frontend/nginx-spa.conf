# Service statique de la SPA (dist/) avec fallback routeur cote client.
# Ce Nginx tourne DANS le conteneur frontend ; il ecoute sur 3000, et le proxy
# partage du serveur (Traefik, regle par Coolify) lui envoie les visiteurs en
# HTTPS termine.
server {
    listen 3000;
    server_name _;

    # Les redirections (de /xr vers /xr/, d'un dossier vers son index) donnent
    # une adresse relative. Sans ce reglage, nginx ecrit une adresse complete
    # avec son propre port et son propre protocole, que le visiteur ne peut
    # pas joindre derriere le proxy : http://<hote>:3000/xr/ (mesure le
    # 04/10/2026).
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    # Compression basique
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    include /etc/nginx/snippets/security-headers.conf;

    # Cache long pour les assets fingerprintes par Vite
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /runtime-config.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store, max-age=0";
        try_files $uri =404;
    }

    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # Cockpit XR, servi sous /xr/. Les deux regles ci-dessus ne le couvraient
    # pas : son index.html partait sans Cache-Control, et le navigateur le
    # gardait au juge. Apres un deploiement, un operateur pouvait donc piloter
    # avec l'ancien cockpit sans le savoir : constate le 13/09, ancien bundle
    # charge alors que le serveur servait le nouveau.
    location = /xr/index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /xr/assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /xr {
        return 308 /xr/;
    }

    # Le cockpit est lui aussi une SPA. Son fallback doit rester dans /xr/
    # et ne jamais retomber sur l'index de la console d'administration.
    location /xr/ {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /xr/index.html;
    }

    # Fallback SPA : toute route inconnue renvoie index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
